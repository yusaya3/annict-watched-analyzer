<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annict Watched Analyzer | アニメ視聴傾向・シンクロ率・AI類似探索</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="stylesheet" href="./css/tokens.css?v=3.0" />
  <link rel="stylesheet" href="./css/layout.css?v=3.0" />
  <link rel="stylesheet" href="./css/components.css?v=3.0" />
  <link rel="stylesheet" href="./css/views.css?v=3.3" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('annict_theme');
        document.documentElement.setAttribute('data-theme', saved || 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <!-- モバイルドロワー用バックドロップ -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <!-- 左サイドバーナビゲーション -->
    <aside id="app-sidebar" class="app-sidebar" aria-label="メインナビゲーション">
      <div class="sidebar-header">
        <a href="#venn" class="sidebar-brand" data-nav="venn">
          <img src="./icon.png" alt="Logo" class="brand-logo" />
          <div class="brand-text">
            <span class="brand-name">Annict Analyzer</span>
            <span class="brand-sub">視聴分析ワークスペース</span>
          </div>
        </a>
        <button id="btn-sidebar-collapse" class="btn-icon-sm sidebar-collapse-btn" title="サイドバーを折りたたむ" aria-label="サイドバー切り替え">
          <i class="fa-solid fa-angles-left"></i>
        </button>
        <button id="btn-sidebar-close-mobile" class="btn-icon-sm sidebar-close-mobile" title="閉じる" aria-label="メニューを閉じる">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <!-- グループ 1 -->
        <div class="nav-group">
          <div class="nav-group-label">メンバー比較・関係性</div>
          <button type="button" class="nav-item active" data-view="venn">
            <span class="nav-icon"><i class="fa-solid fa-chart-pie"></i></span>
            <span class="nav-label">ベン図比較</span>
          </button>
          <button type="button" class="nav-item" data-view="similarity">
            <span class="nav-icon"><i class="fa-solid fa-handshake"></i></span>
            <span class="nav-label">シンクロ率・カバー率</span>
          </button>
          <button type="button" class="nav-item" data-view="insights">
            <span class="nav-icon"><i class="fa-solid fa-lightbulb"></i></span>
            <span class="nav-label">視聴インサイト</span>
          </button>
          <button type="button" class="nav-item" data-view="group">
            <span class="nav-icon"><i class="fa-solid fa-layer-group"></i></span>
            <span class="nav-label">グループ作品カタログ</span>
          </button>
        </div>

        <!-- グループ 2 -->
        <div class="nav-group">
          <div class="nav-group-label">視聴傾向・ジャンル</div>
          <button type="button" class="nav-item" data-view="analytics">
            <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span>
            <span class="nav-label">視聴アナリティクス</span>
          </button>
          <button type="button" class="nav-item" data-view="genre">
            <span class="nav-icon"><i class="fa-solid fa-shapes"></i></span>
            <span class="nav-label">ジャンル分析 &amp; 診断</span>
            <span class="nav-badge">15分類</span>
          </button>
        </div>

        <!-- グループ 3 -->
        <div class="nav-group">
          <div class="nav-group-label">検索・AI探索</div>
          <button type="button" class="nav-item" data-view="search">
            <span class="nav-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
            <span class="nav-label">作品検索・逆引き</span>
          </button>
          <button type="button" class="nav-item" data-view="story">
            <span class="nav-icon"><i class="fa-solid fa-brain"></i></span>
            <span class="nav-label">ストーリー構造類似検索</span>
            <span class="nav-badge nav-badge-ai">AI</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-meta-row">
          <span id="api-status-badge" class="status-pill" title="Annict API接続状態">
            <i class="fa-solid fa-bolt"></i> <span id="api-status-text">確認中...</span>
          </span>
        </div>
        <div class="sidebar-meta-row">
          <span class="meta-updated-text" id="meta-updated" title="データ更新日時">
            <i class="fa-regular fa-clock"></i> 読込中...
          </span>
        </div>
        <div class="sidebar-footer-actions">
          <button type="button" id="btn-theme-toggle" class="btn btn-ghost btn-sm flex-1" title="ダーク / ライトテーマ切替">
            <i class="fa-solid fa-sun"></i> <span>テーマ</span>
          </button>
          <button type="button" id="btn-reload" class="btn btn-ghost btn-sm flex-1" title="全ユーザーの最新データを同期">
            <i class="fa-solid fa-rotate-right"></i> <span>同期</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- メインワークスペース -->
    <div class="main-wrapper">
      <!-- スティッキー・トップバー -->
      <header class="topbar">
        <div class="topbar-left">
          <button id="btn-mobile-menu" class="btn-icon-sm mobile-menu-btn" aria-label="メニューを開く">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="topbar-heading">
            <h1 id="topbar-title" class="topbar-title">ベン図比較</h1>
            <p id="topbar-subtitle" class="topbar-subtitle">1〜3人の視聴作品をインタラクティブなベン図で重ねて比較</p>
          </div>
        </div>
        <div class="topbar-right">
          <div id="topbar-users-summary" class="topbar-users-summary" title="クリックで比較メンバーを管理">
            <i class="fa-solid fa-users"></i>
            <span id="topbar-users-label">読込中...</span>
          </div>
          <button type="button" id="btn-open-user-modal" class="btn btn-primary btn-sm">
            <i class="fa-solid fa-user-gear"></i> <span>メンバー設定</span>
          </button>
        </div>
      </header>

      <!-- コンテンツ領域（各ビュー） -->
      <main id="main-content" class="main-content">
        <!-- 1. ベン図比較 -->
        <section id="view-venn" class="view-pane active" data-view="venn"></section>
        <!-- 2. シンクロ率・カバー率 -->
        <section id="view-similarity" class="view-pane" data-view="similarity"></section>
        <!-- 3. 視聴インサイト -->
        <section id="view-insights" class="view-pane" data-view="insights"></section>
        <!-- 4. グループ作品カタログ -->
        <section id="view-group" class="view-pane" data-view="group"></section>
        <!-- 5. 視聴アナリティクス -->
        <section id="view-analytics" class="view-pane" data-view="analytics"></section>
        <!-- 6. ジャンル分析 & 診断（メイン格上げ） -->
        <section id="view-genre" class="view-pane" data-view="genre"></section>
        <!-- 7. 作品検索・逆引き -->
        <section id="view-search" class="view-pane" data-view="search"></section>
        <!-- 8. ストーリー構造類似検索 -->
        <section id="view-story" class="view-pane" data-view="story"></section>
      </main>
    </div>
  </div>

  <!-- ユーザー管理・追加モーダル -->
  <div id="user-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="user-modal-title" style="display: none;">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h3 id="user-modal-title"><i class="fa-solid fa-users-gear text-pink"></i> 比較ユーザーの管理・追加</h3>
        <button type="button" id="btn-close-user-modal" class="btn-icon-sm" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">Annict のユーザーIDを追加すると、視聴データがブラウザに保存され、全分析に即座に反映されます。</p>
        <div class="add-user-box">
          <label for="new-username-input" class="form-label">新しいAnnictユーザーIDを追加</label>
          <div class="input-with-button">
            <div class="input-prefix-wrap">
              <span class="input-prefix">@</span>
              <input type="text" id="new-username-input" class="input-clean" placeholder="ユーザーID (例: shimbaco)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            </div>
            <button type="button" id="btn-add-user" class="btn btn-primary">
              <i class="fa-solid fa-plus"></i> 追加して分析
            </button>
          </div>
          <small class="text-muted">※ Annictで公開されているアカウントのIDを指定してください</small>
        </div>

        <div class="modal-section-header">
          <h4>登録メンバー一覧 <span id="modal-users-count" class="badge">0人</span></h4>
          <div class="btn-group">
            <button type="button" id="btn-modal-select-all" class="btn btn-outline btn-xs">全選択</button>
            <button type="button" id="btn-modal-deselect-all" class="btn btn-outline btn-xs">1人のみ残す</button>
          </div>
        </div>
        <div id="modal-user-list" class="modal-user-list"></div>

        <div id="user-modal-loading" class="modal-loading-bar" style="display: none;">
          <div class="spinner-sm"></div>
          <span id="user-modal-status">処理中...</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-refresh-all" class="btn btn-outline">
          <i class="fa-solid fa-arrows-rotate"></i> 全データを再同期
        </button>
        <button type="button" id="btn-done-user-modal" class="btn btn-primary">完了</button>
      </div>
    </div>
  </div>

  <!-- 画像拡大モーダル -->
  <div id="image-modal" class="modal-overlay" role="dialog" aria-modal="true" style="display: none;">
    <div class="modal-dialog modal-image">
      <div class="modal-header">
        <h3 id="image-modal-title">作品キービジュアル</h3>
        <button type="button" id="btn-close-image-modal" class="btn-icon-sm" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body text-center">
        <img id="image-modal-img" src="" alt="" class="modal-large-img" />
      </div>
    </div>
  </div>

  <!-- ペア共通作品プレビューモーダル -->
  <div id="pair-common-modal" class="modal-overlay" role="dialog" aria-modal="true" style="display: none;">
    <div class="modal-dialog modal-xl">
      <div class="modal-header">
        <h3 id="pair-modal-title"><i class="fa-solid fa-handshake text-pink"></i> 共通視聴作品</h3>
        <button type="button" id="btn-close-pair-modal" class="btn-icon-sm" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <div id="pair-modal-meta" class="pair-modal-meta"></div>
        <div id="pair-modal-grid" class="anime-cards-grid"></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-pair-open-venn" class="btn btn-primary">
          <i class="fa-solid fa-chart-pie"></i> ベン図比較でこのペアを開く
        </button>
        <button type="button" id="btn-done-pair-modal" class="btn btn-outline">閉じる</button>
      </div>
    </div>
  </div>

  <!-- カスタム確認モーダル（alert / confirm 代替） -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" style="display: none;">
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h3 id="confirm-modal-title">確認</h3>
        <button type="button" id="btn-close-confirm-modal" class="btn-icon-sm" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <p id="confirm-modal-message" class="modal-desc"></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-confirm-cancel" class="btn btn-outline">キャンセル</button>
        <button type="button" id="btn-confirm-ok" class="btn btn-primary">実行する</button>
      </div>
    </div>
  </div>

  <!-- トースト通知コンテナ -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/build/venn.min.js"></script>

  <!-- Core Shared Engines (Single Source UMD) -->
  <script src="./core/genre-engine.js?v=3.2"></script>
  <script src="./core/studio-dictionary.js?v=3.2"></script>
  <script src="./core/analyzer-engine.js?v=3.2"></script>
  <script src="./core/storage.js?v=3.0"></script>
  <script src="./core/ui-utils.js?v=3.0"></script>
  <script src="./core/store.js?v=3.2"></script>

  <!-- Feature Views (8 Views) -->
  <script src="./views/venn-view.js?v=3.0"></script>
  <script src="./views/similarity-view.js?v=3.0"></script>
  <script src="./views/insights-view.js?v=3.0"></script>
  <script src="./views/group-view.js?v=3.0"></script>
  <script src="./views/analytics-view.js?v=3.3"></script>
  <script src="./views/genre-view.js?v=3.0"></script>
  <script src="./views/search-view.js?v=3.0"></script>
  <script src="./views/story-view.js?v=3.0"></script>

  <!-- Application Entry -->
  <script src="./app.js?v=3.0"></script>
</body>
</html>
